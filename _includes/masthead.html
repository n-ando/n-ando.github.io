<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Site navigation">
        <a class="site-title" href="{% if site.active_lang == 'en' %}/en/{% else %}/{% endif %}">Noriaki Ando</a>
        {% assign current_lang = site.active_lang | default: site.default_lang %}
        {% assign menu_items = site.data.navigation[current_lang] %}
        <ul class="visible-links">
          {% for link in menu_items %}
          <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item nav-language">
            {% if current_lang == 'en' %}
            <a href="/" lang="ja" aria-label="日本語ページへ">JP</a><span> / EN</span>
            {% else %}
            <span>JP / </span><a href="/en/" lang="en" aria-label="English version">EN</a>
            {% endif %}
          </li>
        </ul>
        <button class="greedy-nav__toggle hidden" type="button" aria-label="More menu items"><div class="navicon"></div></button>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
